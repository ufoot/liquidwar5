  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        dnf install -y \
          allegro5-devel \
          autoconf \
          automake \
          make \
          gcc \
          gcc-c++ \
          clang \
          pkg-config

    - name: Run autoconf
      run: autoconf

    - name: Configure with GCC
      run: ./configure --prefix=$HOME/lw5-gcc CC=gcc

    - name: Build with GCC
      run: make

    - name: Install GCC build
      run: make install

    - name: Test GCC build
      run: |
        if [ ! -x "$HOME/lw5-gcc/bin/liquidwar" ]; then
          echo "ERROR: $HOME/lw5-gcc/bin/liquidwar is not executable"
          exit 1
        fi
        VERSION_OUTPUT=$($HOME/lw5-gcc/bin/liquidwar --version)
        echo "GCC build version: $VERSION_OUTPUT"
        if echo "$VERSION_OUTPUT" | head -n1 | grep -q '^5'; then
          echo "SUCCESS: GCC build version starts with 5"
        else
          echo "ERROR: GCC build version does not start with 5"
          exit 1
        fi

    - name: Clean
      run: make clean

    - name: Configure with Clang
      run: ./configure --prefix=$HOME/lw5-clang CC=clang

    - name: Build with Clang
      run: make

    - name: Install Clang build
      run: make install

    - name: Test Clang build
      run: |
        if [ ! -x "$HOME/lw5-clang/bin/liquidwar" ]; then
          echo "ERROR: $HOME/lw5-clang/bin/liquidwar is not executable"
          exit 1
        fi
        VERSION_OUTPUT=$($HOME/lw5-clang/bin/liquidwar --version)
        echo "Clang build version: $VERSION_OUTPUT"
        if echo "$VERSION_OUTPUT" | head -n1 | grep -q '^5'; then
          echo "SUCCESS: Clang build version starts with 5"
        else
          echo "ERROR: Clang build version does not start with 5"
          exit 1
        fi

    - name: Clean
      run: make clean

  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm \
          allegro \
          autoconf \
          automake \
          make \
          gcc \
          clang \
          pkg-config

    - name: Run autoconf
      run: autoconf

    - name: Configure with GCC
      run: ./configure --prefix=$HOME/lw5-gcc CC=gcc

    - name: Build with GCC
      run: make

    - name: Install GCC build
      run: make install

    - name: Test GCC build
      run: |
        if [ ! -x "$HOME/lw5-gcc/bin/liquidwar" ]; then
          echo "ERROR: $HOME/lw5-gcc/bin/liquidwar is not executable"
          exit 1
        fi
        VERSION_OUTPUT=$($HOME/lw5-gcc/bin/liquidwar --version)
        echo "GCC build version: $VERSION_OUTPUT"
        if echo "$VERSION_OUTPUT" | head -n1 | grep -q '^5'; then
          echo "SUCCESS: GCC build version starts with 5"
        else
          echo "ERROR: GCC build version does not start with 5"
          exit 1
        fi

    - name: Clean
      run: make clean

    - name: Configure with Clang
      run: ./configure --prefix=$HOME/lw5-clang CC=clang

    - name: Build with Clang
      run: make

    - name: Install Clang build
      run: make install

    - name: Test Clang build
      run: |
        if [ ! -x "$HOME/lw5-clang/bin/liquidwar" ]; then
          echo "ERROR: $HOME/lw5-clang/bin/liquidwar is not executable"
          exit 1
        fi
        VERSION_OUTPUT=$($HOME/lw5-clang/bin/liquidwar --version)
        echo "Clang build version: $VERSION_OUTPUT"
        if echo "$VERSION_OUTPUT" | head -n1 | grep -q '^5'; then
          echo "SUCCESS: Clang build version starts with 5"
        else
          echo "ERROR: Clang build version does not start with 5"
          exit 1
        fi

    - name: Clean
      run: make clean

  build-source:
    runs-on: ubuntu-latest
    needs: [build-fedora, build-ubuntu, build-debian, build-arch]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          liballegro5-dev \
          liballegro-acodec5-dev \
          liballegro-audio5-dev \
          liballegro-image5-dev \
          liballegro-physfs5-dev \
          autoconf \
          automake \
          build-essential \
          pkg-config

    - name: Generate configure script
      run: autoconf

    - name: Configure
      run: ./configure

    - name: Build source package
      run: make package_source

    - name: List generated packages
      run: |
        echo "Generated source packages:"
        ls -lh liquidwar-*.tar.gz || ( echo "No .tar.gz found" && exit 1 )

    - name: Upload source package
      uses: actions/upload-artifact@v4
      with:
        name: liquidwar-source-package
        path: liquidwar-*.tar.gz
        retention-days: 61
