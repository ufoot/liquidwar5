name: build-quick

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-default:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          liballegro5-dev \
          liballegro-acodec5-dev \
          liballegro-audio5-dev \
          liballegro-image5-dev \
          liballegro-physfs5-dev \
          autoconf \
          automake \
          build-essential \
          pkg-config

    - name: Generate configure script
      run: autoconf

    - name: Configure
      run: ./configure

    - name: Build
      run: make
